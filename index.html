<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --logout-bg: #1F1713;
            --logout-text: #FFEED2;
            --dark-ui: #1F1713;
            --border-sep: #78866B; 
            --day-bg: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header-subtitle {
            font-size: 11px; 
            opacity: 0.9;
        }

        .status-bar {
            height: 52px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--logout-bg);
            border: 1px solid var(--logout-text);
            color: var(--logout-text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls-area {
            display: none;
            padding: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .cal-btn {
            width: 50px;
            height: 50px;
            background-color: var(--dark-ui);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .cal-btn:active {
            transform: scale(0.95);
        }

        .cal-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--logout-text);
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: flex-start;
            backdrop-filter: blur(2px);
            padding: 0 12px;
            box-sizing: border-box;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dark-ui);
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
            margin-top: 140px;
            margin-bottom: 20px;
            /* Предотвращаем стандартное поведение браузера при свайпах внутри модалки */
            touch-action: none; 
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            color: var(--dark-ui);
            touch-action: auto; /* Разрешаем нажатия на кнопки */
        }

        .date-navigation {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
        }

        .nav-arrow {
            background: none;
            border: none;
            font-size: 20px;
            cursor: pointer;
            color: var(--dark-ui);
            padding: 5px 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
        }

        .date-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 140px;
        }

        #currentDateTitle {
            font-size: 18px;
            font-weight: 800;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark-ui);
            padding: 0;
            line-height: 1;
            margin-left: 10px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            color: var(--dark-ui);
            touch-action: pan-y; /* Разрешаем вертикальную прокрутку, если нужно, но JS будет ловить X */
        }

        .day-name {
            font-size: 11px;
            font-weight: 800;
            padding: 8px 0;
            text-transform: uppercase;
            margin-bottom: 5px;
            opacity: 0.7;
        }

        .day {
            padding: 12px 0;
            font-size: 14px;
            background-color: var(--day-bg);
            border-radius: 6px;
            border: 1px solid transparent;
            transition: background 0.1s;
            cursor: pointer;
        }

        .day.selected {
            background-color: var(--brand-color);
            color: white;
        }

        .today {
            border: 1.5px solid var(--dark-ui);
            background-color: #fff;
            font-weight: 900;
        }

        .empty-cell {
            background-color: transparent;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div class="header-subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <div class="controls-area" id="controlsArea">
        <button class="cal-btn" id="openCalendar" title="Открыть календарь">
            <svg viewBox="0 0 24 24">
                <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
            </svg>
        </button>
    </div>

    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content" id="swipeArea">
            <div class="modal-header">
                <div class="date-navigation">
                    <button class="nav-arrow" id="prevMonth" title="Предыдущий месяц">❮</button>
                    <div class="date-container">
                        <span id="currentDateTitle">--.--</span>
                    </div>
                    <button class="nav-arrow" id="nextMonth" title="Следующий месяц">❯</button>
                </div>
                <button class="close-modal" id="closeCalendar">&times;</button>
            </div>
            
            <div class="calendar-grid" id="calendarGrid">
                <!-- JS Fill -->
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "ILYA-SKCTGRFWBMXMKQY": { name: "Илья", type: "Кейтеринг" },
            "MIHAIL-RRZELPUUDKKWH": { name: "Михаил", type: "Кейтеринг" },
            "ALEKSANDR-ZNLOECNPWC": { name: "Александр", type: "Кейтеринг" },
            "SVETLANA-BCPYOFHTQLH": { name: "Светлана", type: "Кейтеринг" },
            "IRINA-XZVQVVEDNLHPQL": { name: "Ирина", type: "Кейтеринг" },
            "MARIYA-OBEJMOVRJOWLM": { name: "Мария", type: "Банкет" },
            "MARGARITA-OEZIJCSZOB": { name: "Маргарита", type: "Банкет" },
            "EKATERINA-OIPVVDUULA": { name: "Екатерина", type: "Банкет" },
            "ROMAN-XINGOXQCHUREVX": { name: "Роман", type: "Банкет" },
            "LUBOV-LYSYQXWOBLVOEZ": { name: "Любовь", type: "Банкет" },
            "SU-JPQDNIRXDCARMAVTH": { name: "SU Илья", type: "ROOT" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const controlsArea = document.getElementById('controlsArea');
        const modal = document.getElementById('calendarModal');
        const calGrid = document.getElementById('calendarGrid');
        const dateTitle = document.getElementById('currentDateTitle');
        const swipeArea = document.getElementById('swipeArea');

        let displayedMonth = new Date().getMonth();
        let displayedYear = new Date().getFullYear();

        // Переменные для свайпа
        let touchStartX = 0;
        let touchEndX = 0;

        async function initAuth() {
            try { await signInAnonymously(auth); } catch (e) { console.error(e); }
        }
        initAuth();

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) {
                login(USER_DB[val]);
            }
        });

        function login(user) {
            localStorage.setItem('mutki_user', JSON.stringify(user));
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            `;
            controlsArea.style.display = 'block';
            autoLogActivity(user);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';
            try {
                if (!auth.currentUser) await signInAnonymously(auth);
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        function changeMonth(delta) {
            displayedMonth += delta;
            if (displayedMonth < 0) { 
                displayedMonth = 11; 
                displayedYear--; 
            } else if (displayedMonth > 11) { 
                displayedMonth = 0; 
                displayedYear++; 
            }
            buildCalendar(displayedMonth, displayedYear);
        }

        function buildCalendar(m, y) {
            const realNow = new Date();
            const realToday = realNow.getDate();
            const realMonth = realNow.getMonth();
            const realYear = realNow.getFullYear();

            const monthsGenitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const monthsNominative = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

            const isCurrentMonth = (m === realMonth && y === realYear);
            const isCurrentYear = (y === realYear);

            if (isCurrentMonth) {
                dateTitle.innerText = `${realToday} ${monthsGenitive[m]}`;
            } else {
                let title = monthsNominative[m];
                if (!isCurrentYear) title += ` ${y}`;
                dateTitle.innerText = title;
            }

            calGrid.innerHTML = '';
            const daysShort = ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'];
            daysShort.forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-name';
                el.innerText = d;
                calGrid.appendChild(el);
            });

            const firstDayOfMonth = new Date(y, m, 1).getDay();
            const offset = firstDayOfMonth === 0 ? 6 : firstDayOfMonth - 1; 
            const daysInMonth = new Date(y, m + 1, 0).getDate();

            for (let i = 0; i < offset; i++) {
                const empty = document.createElement('div');
                empty.className = 'empty-cell';
                calGrid.appendChild(empty);
            }

            for (let d = 1; d <= daysInMonth; d++) {
                const el = document.createElement('div');
                el.className = 'day';
                if (isCurrentMonth && d === realToday) el.classList.add('today');
                
                el.innerText = d;
                el.onclick = () => {
                    console.log(`Выбрана дата: ${d}.${m + 1}.${y}`);
                };
                calGrid.appendChild(el);
            }
        }

        // Обработчики кнопок
        document.getElementById('prevMonth').addEventListener('click', () => changeMonth(-1));
        document.getElementById('nextMonth').addEventListener('click', () => changeMonth(1));

        // Обработка свайпов
        swipeArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
        }, { passive: true });

        swipeArea.addEventListener('touchend', (e) => {
            touchEndX = e.changedTouches[0].screenX;
            handleSwipe();
        }, { passive: true });

        function handleSwipe() {
            const threshold = 50; // Порог в пикселях для срабатывания свайпа
            if (touchStartX - touchEndX > threshold) {
                // Свайп влево -> следующий месяц
                changeMonth(1);
            } else if (touchEndX - touchStartX > threshold) {
                // Свайп вправо -> предыдущий месяц
                changeMonth(-1);
            }
        }

        document.getElementById('openCalendar').addEventListener('click', () => {
            const now = new Date();
            displayedMonth = now.getMonth();
            displayedYear = now.getFullYear();
            buildCalendar(displayedMonth, displayedYear);
            modal.style.display = 'flex';
        });

        document.getElementById('closeCalendar').addEventListener('click', () => {
            modal.style.display = 'none';
        });

        window.onclick = (event) => {
            if (event.target == modal) modal.style.display = 'none';
        }

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));
    </script>
</body>
</html>
