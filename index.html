<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Админские Мутки</title>
    <meta name="theme-color" content="#604539">
    <style>
        :root {
            --primary-bg: #FFEED2;
            --brand-color: #604539;
            --accent: #4CAF50;
            --text-light: #FFFFFF;
            --error: #ff4444;
            --logout-bg: #1F1713;
            --logout-text: #FFEED2;
            --dark-ui: #1F1713;
            --border-sep: #78866B; 
            --day-bg: #f5f5f5;
        }

        body {
            margin: 0;
            font-family: 'Segoe UI', -apple-system, sans-serif;
            background-color: var(--primary-bg);
            color: #333;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        header {
            padding: 12px 16px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            color: white;
            position: relative;
            z-index: 10;
        }

        .logo-container {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .logo-img {
            width: 32px;
            height: 32px;
            object-fit: contain;
        }

        .header-subtitle {
            font-size: 11px; 
            opacity: 0.9;
        }

        .status-bar {
            height: 52px;
            background-color: var(--brand-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            position: relative;
        }

        .token-input {
            background: transparent;
            border: none;
            color: white;
            font-size: 14px;
            font-weight: bold;
            width: 100%; 
            height: 100%;
            outline: none;
            text-transform: uppercase;
            text-align: center;
        }

        .token-input::placeholder {
            color: #b5a49d;
        }

        .user-info-badge {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            gap: 10px;
            align-items: center;
            position: relative;
        }

        .logout-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background-color: var(--logout-bg);
            border: 1px solid var(--logout-text);
            color: var(--logout-text);
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 11px;
            font-weight: normal;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .controls-area {
            display: none;
            padding: 16px;
            animation: fadeIn 0.4s ease-out;
        }

        .buttons-grid {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }

        .action-btn {
            width: 50px;
            height: 50px;
            background-color: var(--dark-ui);
            border: none;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.1s;
            box-shadow: 0 2px 8px rgba(0,0,0,0.2);
        }

        .action-btn:active {
            transform: scale(0.95);
        }

        .action-btn svg {
            width: 28px;
            height: 28px;
            fill: var(--logout-text);
        }

        .events-container {
            border: 1px solid #1F1713;
            background: transparent;
            border-radius: 8px;
            padding: 12px;
            margin-top: 12px;
        }

        .events-title {
            font-size: 12px;
            font-weight: 900;
            color: #1F1713;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 1px solid rgba(31, 23, 19, 0.2);
            padding-bottom: 4px;
        }

        .event-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .event-item {
            font-size: 14px;
            padding: 10px 0;
            border-bottom: 1px dashed rgba(31, 23, 19, 0.1);
            display: flex;
            gap: 8px;
            color: #1F1713;
            align-items: center; 
        }

        .date-separator {
            height: 1px;
            background-color: #1F1713;
            margin: 8px 0;
            width: 100%;
        }

        .event-item:last-child {
            border-bottom: none;
        }

        .event-date {
            font-weight: 800;
            white-space: nowrap;
            min-width: 42px;
        }

        .event-content-wrapper {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 2px;
            overflow: hidden;
        }

        .event-desc {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            font-weight: 600;
        }
        
        .event-type-tag {
            font-size: 10px;
            font-weight: bold;
            opacity: 0.6;
            margin-right: 4px;
        }

        .action-icons-container {
            display: flex;
            gap: 4px;
            align-items: center;
        }

        .edit-icon-btn, .info-icon-btn {
            background: none;
            border: none;
            padding: 6px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0.7;
        }

        .edit-icon-btn:active, .info-icon-btn:active { opacity: 1; }
        .edit-icon-btn svg, .info-icon-btn svg { width: 18px; height: 18px; fill: var(--dark-ui); }

        .edit-icon-btn.readonly {
            opacity: 0.2;
            cursor: default;
            pointer-events: none;
        }

        .no-events {
            font-size: 12px;
            opacity: 0.6;
            font-style: italic;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 100;
            justify-content: center;
            align-items: flex-start;
            backdrop-filter: blur(2px);
            padding: 0 12px;
            box-sizing: border-box;
            overflow-y: auto;
        }

        .modal-content {
            background: white;
            border: 1px solid var(--dark-ui);
            border-radius: 12px;
            width: 100%;
            max-width: 360px;
            padding: 16px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.2);
            box-sizing: border-box;
            position: relative;
            margin-top: 60px;
            margin-bottom: 20px;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            color: var(--dark-ui);
        }

        .modal-title {
            font-size: 18px;
            font-weight: 800;
            text-transform: uppercase;
        }

        .close-modal {
            background: none;
            border: none;
            font-size: 28px;
            cursor: pointer;
            color: var(--dark-ui);
            padding: 0;
            line-height: 1;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-label {
            display: block;
            font-size: 12px;
            font-weight: bold;
            margin-bottom: 5px;
            color: var(--brand-color);
            text-transform: uppercase;
        }

        .detail-row {
            padding: 8px 0;
            border-bottom: 1px dashed rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 2px;
        }

        .detail-row:last-child {
            border-bottom: none;
        }

        .detail-label {
            font-size: 10px;
            font-weight: 900;
            text-transform: uppercase;
            color: var(--brand-color);
            opacity: 0.7;
        }

        .detail-value {
            font-size: 15px;
            font-weight: 600;
            color: var(--dark-ui);
        }

        .form-input, .form-select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
            font-family: inherit;
            background-color: #fff;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--brand-color);
            box-shadow: 0 0 0 2px rgba(96, 69, 57, 0.1);
        }

        .submit-btn {
            width: 100%;
            padding: 14px;
            background-color: var(--dark-ui);
            color: var(--logout-text);
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: 800;
            text-transform: uppercase;
            cursor: pointer;
            margin-top: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .calendar-nav {
            display: flex;
            align-items: center;
            justify-content: center;
            flex-grow: 1;
            gap: 15px;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 4px;
            text-align: center;
            color: var(--dark-ui);
        }

        .day-name {
            font-size: 11px;
            font-weight: 800;
            padding-bottom: 8px;
            text-transform: uppercase;
            opacity: 0.7;
        }

        .day {
            aspect-ratio: 1 / 1;
            font-size: 14px;
            background-color: var(--day-bg);
            border-radius: 0; 
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .today {
            border: 1.5px solid var(--dark-ui);
            background-color: #fff;
            font-weight: 900;
            z-index: 1;
        }

        .day.has-event {
            background-color: #604539 !important;
            color: #FFEED2 !important;
            font-weight: bold;
        }

        .record-indicator {
            width: 8px;
            height: 8px;
            background-color: #4CAF50;
            border-radius: 50%;
            display: none;
        }

        .recording { display: block; animation: pulse 1s infinite alternate; }
        .recorded { display: block; }
        .record-error { display: block; background-color: var(--error); }

        @keyframes pulse {
            from { opacity: 1; transform: scale(1.1); }
            to { opacity: 0.4; transform: scale(0.8); }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo-container">
            <img src="ico/catering-b.ico" alt="Logo" class="logo-img" onerror="this.style.display='none'">
        </div>
        <div style="text-align: right;">
            <div style="font-size: 14px; font-weight: 900; letter-spacing: 0.5px;">АДМИНСКИЕ МУТКИ</div>
            <div class="header-subtitle">ВАНИЛЬНОГО НЕБА</div>
        </div>
    </header>

    <div class="status-bar" id="statusBar">
        <input type="password" id="tokenInput" class="token-input" placeholder="ВВЕДИТЕ ТОКЕН ДОСТУПА">
    </div>

    <div class="controls-area" id="controlsArea">
        <div class="buttons-grid">
            <button class="action-btn" id="openCalendar" title="Открыть календарь">
                <svg viewBox="0 0 24 24">
                    <path d="M19,4H18V2H16V4H8V2H6V4H5C3.89,4 3,4.9 3,6V20A2,2 0 0,0 5,22H19A2,2 0 0,0 21,20V6A2,2 0 0,0 19,4M19,20H5V10H19V20M19,8H5V6H19V8Z" />
                </svg>
            </button>
            <button class="action-btn" id="addEntryBtn" title="Добавить запись">
                <svg viewBox="0 0 24 24">
                    <path d="M19,13H13V19H11V13H5V11H11V5H13V11H19V13Z" />
                </svg>
            </button>
        </div>

        <div class="events-container">
            <div class="events-title">Предстоящие мероприятия</div>
            <div id="upcomingEventsList" class="event-list">
                <div class="no-events">Загрузка данных...</div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="calendarModal">
        <div class="modal-content" id="swipeArea" style="touch-action: none;">
            <div class="modal-header">
                <div class="calendar-nav">
                    <button class="close-modal" id="prevMonth" style="font-size: 20px;">❮</button>
                    <span id="currentDateTitle" class="modal-title">--.--</span>
                    <button class="close-modal" id="nextMonth" style="font-size: 20px;">❯</button>
                </div>
                <button class="close-modal" id="closeCalendar">&times;</button>
            </div>
            <div class="calendar-grid" id="calendarGrid"></div>
        </div>
    </div>

    <!-- МОДАЛКА ПОДРОБНОСТЕЙ -->
    <div class="modal-overlay" id="infoModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Информация</span>
                <button class="close-modal" onclick="closeAllModals()">&times;</button>
            </div>
            <div id="infoDetailsContainer">
                <!-- Сюда вставляются детали динамически -->
            </div>
        </div>
    </div>

    <!-- МОДАЛКА РЕДАКТИРОВАНИЯ -->
    <div class="modal-overlay" id="editModal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title">Редактировать</span>
                <button class="close-modal" onclick="closeAllModals()">&times;</button>
            </div>
            <input type="hidden" id="editId">
            <input type="hidden" id="editType">
            <div class="form-group">
                <label class="form-label">Дата мероприятия</label>
                <input type="text" id="editDate" class="form-input date-mask" placeholder="ДД.ММ.ГГГГ" inputmode="numeric">
            </div>
            <div class="form-group">
                <label class="form-label" id="editLabelInfo">Информация</label>
                <input type="text" class="form-input" id="editInfoInput" placeholder="Основные данные">
            </div>
            <div class="form-group" id="editExtraGroup">
                <label class="form-label" id="editLabelExtra">Доп. информация</label>
                <div id="editExtraContainer"></div>
            </div>
            <div class="form-group">
                <label class="form-label">Количество гостей</label>
                <input type="number" class="form-input" id="editGuestsInput" placeholder="0" inputmode="numeric">
            </div>
            <button class="submit-btn" id="saveEditBtn">
                <span>Сохранить</span>
            </button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, serverTimestamp, query, onSnapshot, getDocs } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js";
        import { getAuth, signInWithCustomToken, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyBEn2ZheCPUMgTKxuQmHw0MPehIu1B85Do",
            authDomain: "vanilnoeneboapp.firebaseapp.com",
            projectId: "vanilnoeneboapp",
            storageBucket: "vanilnoeneboapp.firebasestorage.app",
            messagingSenderId: "648309181653",
            appId: "1:648309181653:web:64f690d6acb67ea8fea65c"
        };

        const actualConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        const app = initializeApp(actualConfig);
        const db = getFirestore(app);
        const auth = getAuth(app);
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'vn-mutki';

        const USER_DB = {
            "ILYA-SKCTGRFWBMXMKQY": { name: "Илья", type: "Кейтеринг" },
            "MIHAIL-RRZELPUUDKKWH": { name: "Михаил", type: "Кейтеринг" },
            "ALEKSANDR-ZNLOECNPWC": { name: "Александр", type: "Кейтеринг" },
            "SVETLANA-BCPYOFHTQLH": { name: "Светлана", type: "Кейтеринг" },
            "IRINA-XZVQVVEDNLHPQL": { name: "Ирина", type: "Кейтеринг" },
            "MARIYA-OBEJMOVRJOWLM": { name: "Мария", type: "Банкет" },
            "MARGARITA-OEZIJCSZOB": { name: "Маргарита", type: "Банкет" },
            "EKATERINA-OIPVVDUULA": { name: "Екатерина", type: "Банкет" },
            "ROMAN-XINGOXQCHUREVX": { name: "Роман", type: "Банкет" },
            "LUBOV-LYSYQXWOBLVOEZ": { name: "Любовь", type: "Банкет" },
            "SU-JPQDNIRXDCARMAVTH": { name: "SU Илья", type: "ROOT" }
        }

        const input = document.getElementById('tokenInput');
        const statusBar = document.getElementById('statusBar');
        const controlsArea = document.getElementById('controlsArea');
        const calGrid = document.getElementById('calendarGrid');
        const dateTitle = document.getElementById('currentDateTitle');
        const swipeArea = document.getElementById('swipeArea');
        const upcomingList = document.getElementById('upcomingEventsList');

        let currentUser = null;
        let globalEvents = [];
        let displayedMonth = new Date().getMonth();
        let displayedYear = new Date().getFullYear();

        async function initAuth() {
            try { 
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth); 
                }
            } catch (e) { console.error(e); }
        }
        initAuth();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                subscribeToEvents();
            }
        });

        input.addEventListener('input', () => {
            const val = input.value.trim().toUpperCase();
            if (USER_DB[val]) login(USER_DB[val]);
        });

        function login(user) {
            currentUser = user;
            localStorage.setItem('mutki_user', JSON.stringify(user));
            statusBar.innerHTML = `
                <div class="user-info-badge">
                    <div id="recordIndicator" class="record-indicator"></div>
                    <span>${user.name}</span>
                </div>
                <button class="logout-btn" onclick="logout()">Выход</button>
            `;
            controlsArea.style.display = 'block';
            autoLogActivity(user);
            if (globalEvents.length > 0) renderEvents(globalEvents);
        }

        async function autoLogActivity(user) {
            const currentIndicator = document.getElementById('recordIndicator');
            if (currentIndicator) currentIndicator.className = 'record-indicator recording';
            try {
                const logRef = collection(db, 'artifacts', appId, 'public', 'data', 'user_logs');
                await addDoc(logRef, {
                    userName: user.name,
                    userType: user.type,
                    timestamp: serverTimestamp(),
                    event: "SESSION_START"
                });
                if (currentIndicator) currentIndicator.className = 'record-indicator recorded';
            } catch (e) {
                if (currentIndicator) currentIndicator.className = 'record-indicator record-error';
            }
        }

        function subscribeToEvents() {
            const eventsRef = collection(db, 'artifacts', appId, 'public', 'data', 'events');
            onSnapshot(eventsRef, (snapshot) => {
                let events = [];
                snapshot.forEach(doc => {
                    events.push({ id: doc.id, ...doc.data() });
                });

                const parseDate = (s) => {
                    if (!s) return 0;
                    const parts = s.split('.').map(Number);
                    if (parts.length < 3) return 0;
                    return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
                };

                events.sort((a, b) => parseDate(a.date) - parseDate(b.date));
                globalEvents = events;
                renderEvents(events);
                if (document.getElementById('calendarModal').style.display === 'flex') {
                    buildCalendar(displayedMonth, displayedYear);
                }
            }, (error) => {
                upcomingList.innerHTML = `<div class="no-events" style="color:red">Ошибка доступа</div>`;
            });
        }

        function renderEvents(events) {
            const today = new Date();
            const todayStr = today.toLocaleDateString('ru-RU');
            const todayTime = new Date(today.getFullYear(), today.getMonth(), today.getDate()).getTime();

            const parseDate = (s) => {
                if (!s) return 0;
                const parts = s.split('.').map(Number);
                if (parts.length < 3) return 0;
                return new Date(parts[2], parts[1] - 1, parts[0]).getTime();
            };

            let filtered = events.filter(e => parseDate(e.date) >= todayTime);
            if (currentUser && currentUser.type !== "ROOT") {
                filtered = filtered.filter(e => e.type === currentUser.type);
            }

            if (filtered.length === 0) {
                upcomingList.innerHTML = `<div class="no-events">Мероприятий пока нет</div>`;
                return;
            }

            const limit = filtered.slice(0, 15);
            upcomingList.innerHTML = '';

            let separatorAdded = false;
            let hasTodayEvents = limit.some(e => e.date === todayStr);

            limit.forEach(e => {
                if (hasTodayEvents && !separatorAdded && e.date !== todayStr) {
                    const separator = document.createElement('div');
                    separator.className = 'date-separator';
                    upcomingList.appendChild(separator);
                    separatorAdded = true;
                }

                const item = document.createElement('div');
                item.className = 'event-item';
                const shortDate = e.date ? e.date.substring(0, 5) : "--.--";
                
                let description = '';
                if (e.type === 'Кейтеринг') {
                    description = e.eventName || 'Кейтеринг (без названия)';
                } else {
                    description = e.customer || 'Заказчик не указан';
                    if (e.hall) description += ` | ${e.hall}`;
                }

                let typePrefix = '';
                if (currentUser && currentUser.type === "ROOT") {
                    typePrefix = `<span class="event-type-tag">[${e.type === 'Кейтеринг' ? 'К' : 'Б'}]</span>`;
                }

                item.innerHTML = `
                    <span class="event-date">${shortDate}</span>
                    <div class="event-content-wrapper">
                        <div class="event-desc">${typePrefix}${description}</div>
                    </div>
                    <div class="action-icons-container" id="actions-${e.id}"></div>
                `;

                upcomingList.appendChild(item);
                const actionContainer = document.getElementById(`actions-${e.id}`);

                const infoBtn = document.createElement('button');
                infoBtn.className = 'info-icon-btn';
                infoBtn.onclick = () => openInfoModal(e);
                infoBtn.innerHTML = `
                    <svg viewBox="0 0 24 24">
                        <path d="M11,9H13V7H11M12,20C7.59,20 4,16.41 4,12C4,7.59 7.59,4 12,4C16.41,4 20,7.59 20,12C20,16.41 16.41,20 12,20M12,2A10,10 0 0,0 2,12A10,10 0 0,0 12,22A10,10 0 0,0 22,12A10,10 0 0,0 12,2M11,17H13V11H11V17Z" />
                    </svg>
                `;
                actionContainer.appendChild(infoBtn);

                if (currentUser) {
                    const editBtn = document.createElement('button');
                    editBtn.className = 'edit-icon-btn';
                    if (currentUser.type === 'ROOT') {
                        editBtn.classList.add('readonly');
                    } else {
                        editBtn.onclick = () => openEditModal(e);
                    }
                    editBtn.innerHTML = `
                        <svg viewBox="0 0 24 24">
                            <path d="M20.71,7.04C21.1,6.65 21.1,6 20.71,5.63L18.37,3.29C18,2.9 17.35,2.9 16.96,3.29L15.12,5.12L18.87,8.87M3,17.25V21H6.75L17.81,9.93L14.06,6.18L3,17.25Z" />
                        </svg>
                    `;
                    actionContainer.appendChild(editBtn);
                }
            });
        }

        function openInfoModal(event) {
            const container = document.getElementById('infoDetailsContainer');
            let content = '';

            if (currentUser && currentUser.type === 'ROOT') {
                content += `
                    <div class="detail-row">
                        <span class="detail-label">Тип</span>
                        <span class="detail-value">${event.type}</span>
                    </div>
                `;
            }

            content += `
                <div class="detail-row">
                    <span class="detail-label">Дата</span>
                    <span class="detail-value">${event.date}</span>
                </div>
            `;

            if (event.type === 'Кейтеринг') {
                content += `
                    <div class="detail-row">
                        <span class="detail-label">Название</span>
                        <span class="detail-value">${event.eventName || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Локация</span>
                        <span class="detail-value">${event.location || '-'}</span>
                    </div>
                `;
            } else {
                content += `
                    <div class="detail-row">
                        <span class="detail-label">Заказчик</span>
                        <span class="detail-value">${event.customer || '-'}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Зал</span>
                        <span class="detail-value">${event.hall || '-'}</span>
                    </div>
                `;
            }

            content += `
                <div class="detail-row">
                    <span class="detail-label">Гости</span>
                    <span class="detail-value">${event.guests || 'Не указано'}</span>
                </div>
                <div class="detail-row" style="opacity: 0.5">
                    <span class="detail-label">Создано</span>
                    <span class="detail-value" style="font-size: 11px">${event.createdBy || 'Система'}</span>
                </div>
            `;

            container.innerHTML = content;
            document.getElementById('infoModal').style.display = 'flex';
        }

        function openEditModal(event) {
            document.getElementById('editId').value = event.id;
            document.getElementById('editType').value = event.type;
            document.getElementById('editDate').value = event.date;
            document.getElementById('editGuestsInput').value = event.guests || '';
            
            const infoInput = document.getElementById('editInfoInput');
            const labelInfo = document.getElementById('editLabelInfo');
            const labelExtra = document.getElementById('editLabelExtra');
            const extraContainer = document.getElementById('editExtraContainer');
            
            extraContainer.innerHTML = '';

            if (event.type === 'Кейтеринг') {
                labelInfo.innerText = 'Название мероприятия';
                infoInput.value = event.eventName || '';
                labelExtra.innerText = 'Локация';
                const locInput = document.createElement('input');
                locInput.type = 'text';
                locInput.className = 'form-input';
                locInput.id = 'editExtraInput';
                locInput.value = event.location || '';
                extraContainer.appendChild(locInput);
            } else {
                labelInfo.innerText = 'Заказчик';
                infoInput.value = event.customer || '';
                labelExtra.innerText = 'Зал';
                const hallSelect = document.createElement('select');
                hallSelect.className = 'form-select';
                hallSelect.id = 'editExtraInput';
                ['ББЗ', 'МБЗ', 'Волга', 'Чайка'].forEach(h => {
                    const opt = document.createElement('option');
                    opt.value = h;
                    opt.innerText = h;
                    if (event.hall === h) opt.selected = true;
                    hallSelect.appendChild(opt);
                });
                extraContainer.appendChild(hallSelect);
            }
            document.getElementById('editModal').style.display = 'flex';
        }

        async function saveEdit() {
            const id = document.getElementById('editId').value;
            const type = document.getElementById('editType').value;
            const date = document.getElementById('editDate').value;
            const info = document.getElementById('editInfoInput').value;
            const extra = document.getElementById('editExtraInput').value;
            const guests = document.getElementById('editGuestsInput').value;

            if (!date || !info) return;
            const btn = document.getElementById('saveEditBtn');
            btn.disabled = true;
            btn.innerText = "Сохранение...";
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'events', id);
                const updateData = { 
                    date: date,
                    guests: guests,
                    updatedAt: serverTimestamp(),
                    updatedBy: currentUser.name
                };
                if (type === 'Кейтеринг') {
                    updateData.eventName = info;
                    updateData.location = extra;
                } else {
                    updateData.customer = info;
                    updateData.hall = extra;
                }
                await updateDoc(docRef, updateData);
                closeAllModals();
            } catch (e) { console.error(e); } finally {
                btn.disabled = false;
                btn.innerText = "Сохранить";
            }
        }

        document.getElementById('saveEditBtn').onclick = saveEdit;

        document.querySelectorAll('.date-mask').forEach(input => {
            input.addEventListener('input', (e) => {
                let value = e.target.value.replace(/\D/g, ''); 
                if (value.length > 8) value = value.slice(0, 8); 
                let formattedValue = '';
                if (value.length > 0) {
                    formattedValue = value.slice(0, 2);
                    if (value.length > 2) {
                        formattedValue += '.' + value.slice(2, 4);
                        if (value.length > 4) {
                            formattedValue += '.' + value.slice(4, 8);
                        }
                    }
                }
                e.target.value = formattedValue;
            });
            input.addEventListener('blur', (e) => {
                const val = e.target.value;
                if (val.length === 5 && val.includes('.')) {
                    const currentYear = new Date().getFullYear();
                    e.target.value = val + '.' + currentYear;
                }
            });
        });

        function buildCalendar(m, y) {
            const realNow = new Date();
            const realToday = realNow.getDate();
            const realMonth = realNow.getMonth();
            const realYear = realNow.getFullYear();
            const monthsGenitive = ["января", "февраля", "марта", "апреля", "мая", "июня", "июля", "августа", "сентября", "октября", "ноября", "декабря"];
            const monthsNominative = ["Январь", "Февраль", "Март", "Апрель", "Май", "Июнь", "Июль", "Август", "Сентябрь", "Октябрь", "Ноябрь", "Декабрь"];

            const isCurrentMonth = (m === realMonth && y === realYear);
            dateTitle.innerText = isCurrentMonth ? `${realToday} ${monthsGenitive[m]}` : `${monthsNominative[m]} ${y !== realYear ? y : ''}`;

            calGrid.innerHTML = '';
            ['Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб', 'Вс'].forEach(d => {
                const el = document.createElement('div');
                el.className = 'day-name'; el.innerText = d; calGrid.appendChild(el);
            });

            const firstDay = new Date(y, m, 1).getDay();
            const offset = firstDay === 0 ? 6 : firstDay - 1;
            for (let i = 0; i < offset; i++) {
                const empty = document.createElement('div');
                empty.style.aspectRatio = "1/1";
                calGrid.appendChild(empty);
            }

            const daysInMonth = new Date(y, m + 1, 0).getDate();
            const eventDates = new Set();
            globalEvents.forEach(ev => {
                if (currentUser && currentUser.type !== "ROOT" && ev.type !== currentUser.type) return;
                const parts = ev.date.split('.');
                if (parts.length === 3) {
                    const dVal = parseInt(parts[0]);
                    const mVal = parseInt(parts[1]) - 1;
                    const yVal = parseInt(parts[2]);
                    if (mVal === m && yVal === y) eventDates.add(dVal);
                }
            });

            for (let d = 1; d <= daysInMonth; d++) {
                const el = document.createElement('div');
                el.className = 'day';
                if (isCurrentMonth && d === realToday) el.classList.add('today');
                if (eventDates.has(d)) el.classList.add('has-event');
                el.innerText = d;
                calGrid.appendChild(el);
            }
        }

        document.getElementById('prevMonth').onclick = () => { displayedMonth--; if(displayedMonth<0){displayedMonth=11;displayedYear--} buildCalendar(displayedMonth, displayedYear); };
        document.getElementById('nextMonth').onclick = () => { displayedMonth++; if(displayedMonth>11){displayedMonth=0;displayedYear++} buildCalendar(displayedMonth, displayedYear); };

        let tsX = 0;
        swipeArea.addEventListener('touchstart', e => tsX = e.changedTouches[0].screenX, {passive:true});
        swipeArea.addEventListener('touchend', e => {
            const teX = e.changedTouches[0].screenX;
            if (tsX - teX > 50) document.getElementById('nextMonth').click();
            if (teX - tsX > 50) document.getElementById('prevMonth').click();
        }, {passive:true});

        document.getElementById('openCalendar').onclick = () => {
            displayedMonth = new Date().getMonth();
            displayedYear = new Date().getFullYear();
            buildCalendar(displayedMonth, displayedYear);
            document.getElementById('calendarModal').style.display = 'flex';
        };

        window.closeAllModals = function() {
            document.querySelectorAll('.modal-overlay').forEach(m => m.style.display = 'none');
            document.querySelectorAll('.form-input').forEach(i => i.value = '');
        };

        document.getElementById('closeCalendar').onclick = closeAllModals;
        window.onclick = (e) => { if (e.target.classList.contains('modal-overlay')) closeAllModals(); };

        window.logout = function() {
            localStorage.removeItem('mutki_user');
            location.reload();
        }

        const saved = localStorage.getItem('mutki_user');
        if (saved) login(JSON.parse(saved));
    </script>
</body>
